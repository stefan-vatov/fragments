name: E2E

# Exercise the packaged desktop app on hosted runners nightly and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      FRAGMENTS_TEST_ROOT: /tmp/fragments-rename.ci
      FRAGMENTS_CDP_PORT: "9222"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.12.4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libfuse2 libgtk-3-0t64

      - name: Fetch the Obsidian desktop runtime
        run: |
          curl -fsSL https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest \
            -o "$RUNNER_TEMP/obsidian-release.json"
          url=$(python3 - "$RUNNER_TEMP/obsidian-release.json" "$RUNNER_OS" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as release_file:
              assets = json.load(release_file)["assets"]
          if sys.argv[2] == "Linux":
              matches = [asset for asset in assets if asset["name"].endswith(".AppImage")
                         and not any(arch in asset["name"].lower() for arch in ("arm64", "aarch64"))]
          else:
              matches = [asset for asset in assets if asset["name"].endswith(".dmg")]
          if len(matches) != 1:
              raise SystemExit(f"Expected one desktop runtime, found {len(matches)}")
          print(matches[0]["browser_download_url"])
          PY
          )
          curl -fsSL -o "$RUNNER_TEMP/obsidian-runtime" "$url"

      - name: Extract the Linux runtime
        if: runner.os == 'Linux'
        run: |
          chmod +x "$RUNNER_TEMP/obsidian-runtime"
          cd "$RUNNER_TEMP"
          ./obsidian-runtime --appimage-extract >/dev/null
          sudo chown root:root "$RUNNER_TEMP/squashfs-root/chrome-sandbox"
          sudo chmod 4755 "$RUNNER_TEMP/squashfs-root/chrome-sandbox"

      - name: Install the macOS runtime
        if: runner.os == 'macOS'
        run: |
          mountpoint="$RUNNER_TEMP/obsidian-dmg"
          mkdir -p "$mountpoint"
          hdiutil attach "$RUNNER_TEMP/obsidian-runtime" -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"' EXIT
          ditto "$mountpoint/Obsidian.app" "$RUNNER_TEMP/Obsidian.app"

      - name: Build and prepare the isolated fixture
        run: |
          mkdir -p "$FRAGMENTS_TEST_ROOT"
          FRAGMENTS_BUILD_OUTFILE="$FRAGMENTS_TEST_ROOT/build/main.js" pnpm run build
          node scripts/prepare-e2e-fixture.mjs

      - name: Run Playwright scenarios on Linux
        if: runner.os == 'Linux'
        env:
          FRAGMENTS_DISPLAY_MODE: xvfb
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY -u WAYLAND_SOCKET -u XAUTHORITY \
            xvfb-run -a --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            env FRAGMENTS_OBSIDIAN_EXECUTABLE="$RUNNER_TEMP/squashfs-root/obsidian" \
            node scripts/run-e2e.mjs

      - name: Run Playwright scenarios on macOS
        if: runner.os == 'macOS'
        env:
          FRAGMENTS_DISPLAY_MODE: dedicated-gui
        run: |
          FRAGMENTS_OBSIDIAN_EXECUTABLE="$RUNNER_TEMP/Obsidian.app/Contents/MacOS/Obsidian" \
            node scripts/run-e2e.mjs

      - name: Upload screenshots and session logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-session-${{ matrix.os }}
          path: |
            /tmp/fragments-rename.ci/**/*.png
            /tmp/fragments-rename.ci/**/*.log
            /tmp/fragments-rename.ci/**/*.json
            /tmp/fragments-rename.ci/**/*.zip
            /tmp/fragments-rename.ci/**/error-context.md
          if-no-files-found: ignore
